<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9x9 練習器</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4A90E2">

    <!-- 使用更穩定的 PyScript 版本與語法 -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
	<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>

    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #f0f2f5; }
        .card { background: white; padding: 20px; border-radius: 15px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); min-width: 300px; }
        #question { font-size: 2.5rem; margin-bottom: 20px; color: #333; }
        input { font-size: 1.5rem; width: 80px; padding: 10px; text-align: center; border: 2px solid #ddd; border-radius: 8px; }
        button { font-size: 1.2rem; padding: 10px 20px; margin-left: 10px; cursor: pointer; background: #4A90E2; color: white; border: none; border-radius: 8px; }
        #feedback { margin-top: 20px; font-size: 1.2rem; font-weight: bold; min-height: 1.5em; }
        
        /* 預防性隱藏：在 Python 還沒載入前，不要顯示程式碼文字 */
        script[type="py"] { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <div id="question">環境載入中...</div>
        <input type="number" id="answer" autocomplete="off" id="answer">
        <button id="submit-btn">提交</button>
        <div id="feedback"></div>
    </div>

    <!-- Python 邏輯區塊：改用 script type="py" 語法 -->
    <script type="py">
from pyscript import display, document
import random
import asyncio

num1 = 0
num2 = 0

def next_question():
    global num1, num2
    num1 = random.randint(1, 9)
    num2 = random.randint(1, 9)
    document.querySelector("#question").innerText = f"{num1} × {num2} = ?"
    document.querySelector("#answer").value = ""
    document.querySelector("#feedback").innerText = ""

async def check_answer(event):
    user_input = document.querySelector("#answer").value
    if not user_input:
        return
    
    if int(user_input) == num1 * num2:
        document.querySelector("#feedback").innerText = "✅ 太棒了，答對了！"
        await asyncio.sleep(0.8)
        next_question()
    else:
        document.querySelector("#feedback").innerText = "❌ 算錯囉，再試一次！"

# 綁定按鈕點擊事件
from pyodide.ffi import create_proxy
document.querySelector("#submit-btn").onclick = create_proxy(check_answer)

# 初始出題
next_question()
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error', err));
            });
        }
    </script>
</body>
</html>
