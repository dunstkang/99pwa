<div class="card">
    <div id="stats" style="font-size: 0.9rem; color: #666; margin-bottom: 10px;">
        答對：<span id="correct-count">0</span> | 正確率：<span id="accuracy">0</span>%
    </div>
    <div id="timer" style="font-size: 1.2rem; color: #e74c3c; font-weight: bold;">時間：--</div>
    <div id="question">準備好了嗎？</div>
    <input type="number" id="answer" placeholder="?" autocomplete="off">
    <button id="submit-btn">開始挑戰</button>
    <div id="feedback"></div>
    <div id="high-score" style="margin-top: 15px; font-size: 0.8rem; color: #999;"></div>
</div>

<script type="py">
from pyscript import document, window
import random
import asyncio
import time

num1 = num2 = correct = total = 0
is_running = False
start_time = 0
DURATION = 30 # 挑戰時間 30 秒

def update_ui():
    document.querySelector("#correct-count").innerText = str(correct)
    acc = (correct / total * 100) if total > 0 else 0
    document.querySelector("#accuracy").innerText = f"{acc:.0f}"

def save_high_score(score):
    current_high = window.localStorage.getItem("99_high_score")
    if not current_high or score > int(current_high):
        window.localStorage.setItem("99_high_score", str(score))
        return True
    return False

def show_high_score():
    high = window.localStorage.getItem("99_high_score") or "0"
    document.querySelector("#high-score").innerText = f"最高紀錄：答對 {high} 題"

async def timer_loop():
    global is_running
    while is_running:
        remaining = DURATION - int(time.time() - start_time)
        if remaining <= 0:
            is_running = False
            document.querySelector("#timer").innerText = "時間到！"
            document.querySelector("#question").innerText = "挑戰結束"
            if save_high_score(correct):
                document.querySelector("#feedback").innerText = f"🎊 新紀錄！答對 {correct} 題"
            else:
                document.querySelector("#feedback").innerText = f"總共答對 {correct} 題"
            document.querySelector("#submit-btn").innerText = "重新挑戰"
            show_high_score()
            break
        document.querySelector("#timer").innerText = f"剩餘時間：{remaining}s"
        await asyncio.sleep(1)

def next_question():
    global num1, num2
    num1, num2 = random.randint(2, 9), random.randint(2, 9) # 從 2 開始更有挑戰性
    document.querySelector("#question").innerText = f"{num1} × {num2} = ?"
    document.querySelector("#answer").value = ""

async def handle_click(event):
    global is_running, start_time, correct, total
    
    if not is_running:
        # 開始新遊戲
        is_running = True
        correct = total = 0
        start_time = time.time()
        document.querySelector("#submit-btn").innerText = "提交"
        document.querySelector("#feedback").innerText = ""
        update_ui()
        next_question()
        await timer_loop()
        return

    # 檢查答案
    user_input = document.querySelector("#answer").value
    if not user_input: return
    
    total += 1
    if int(user_input) == num1 * num2:
        correct += 1
        document.querySelector("#feedback").innerText = "✅"
        next_question()
    else:
        document.querySelector("#feedback").innerText = "❌"
    update_ui()

from pyodide.ffi import create_proxy
document.querySelector("#submit-btn").onclick = create_proxy(handle_click)
show_high_score()
</script>
