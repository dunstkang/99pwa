<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正負整數加減挑戰</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4A90E2">

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        :root { --primary: #4A90E2; --danger: #e74c3c; --success: #2ecc71; }
        body { font-family: -apple-system, sans-serif; text-align: center; background: #f0f2f5; padding: 20px; margin: 0; }
        .card { 
            background: white; padding: 25px; border-radius: 20px; 
            display: inline-block; box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            min-width: 350px; max-width: 95%;
        }
        #version-tag { font-size: 0.7rem; color: #ccc; text-align: right; margin-bottom: 5px; }
        #stats { font-size: 1rem; color: #666; margin-bottom: 10px; }
        #timer { font-size: 1.5rem; color: var(--danger); font-weight: bold; margin: 10px 0; }
        #question { font-size: 2.5rem; margin: 20px 0; color: #333; min-height: 1.2em; font-family: 'Courier New', monospace; }
        input { 
            font-size: 2rem; width: 150px; padding: 10px; 
            text-align: center; border: 2px solid #ddd; border-radius: 12px;
            outline: none;
        }
        button { 
            display: block; width: 100%; margin-top: 20px; font-size: 1.2rem; 
            padding: 15px; cursor: pointer; background: var(--primary); 
            color: white; border: none; border-radius: 12px; font-weight: bold;
        }
        #feedback { margin-top: 15px; font-size: 1.2rem; font-weight: bold; min-height: 1.5em; }
        
        #report-container { 
            margin-top: 25px; text-align: left; 
            max-height: 400px; overflow-y: auto; 
            border-top: 2px solid #eee; padding-top: 15px;
            display: none; 
        }
        .report-summary {
            background: #f8f9fa; padding: 15px; border-radius: 10px;
            margin-bottom: 15px; border-left: 5px solid var(--primary);
            font-weight: bold; line-height: 1.6;
        }
        .report-item { 
            display: flex; justify-content: space-between; 
            padding: 8px 15px; border-bottom: 1px solid #f9f9f9;
            font-family: monospace; font-size: 1.1rem;
        }
        .correct { color: var(--success); }
        .wrong { color: var(--danger); }
        #high-score { margin-top: 15px; font-size: 0.8rem; color: #999; }
    </style>
</head>
<body>

    <div class="card">
        <div id="version-tag">Version: 2026.05.02-v2.1 (正負數整數版)</div>
        <div id="stats">答對：<span id="correct-count">0</span> | 正確率：<span id="accuracy">0</span>%</div>
        <div id="timer">準備好了嗎？</div>
        <div id="question">Loading...</div>
        <input type="number" id="answer" inputmode="numeric" placeholder="?">
        <button id="submit-btn">開始挑戰 (30秒)</button>
        <div id="feedback"></div>
        <div id="high-score"></div>

        <div id="report-container">
            <h3 style="text-align:center; margin-top:0;">挑戰結算報告</h3>
            <div id="summary-text" class="report-summary"></div>
            <div id="report-list"></div>
        </div>
    </div>

    <script type="py">
from pyscript import document, window
from pyodide.ffi import create_proxy
import random
import asyncio
import time

# 全域變數
num1 = num2 = ans = correct = total = 0
is_running = False
start_time = 0
DURATION = 30
history = []

def format_num(n, is_first=False):
    """將負數加上括號，增加數學易讀性"""
    if n < 0 and not is_first:
        return f"({n})"
    return str(n)

def update_ui():
    document.querySelector("#correct-count").innerText = str(correct)
    acc = (correct / total * 100) if total > 0 else 0
    document.querySelector("#accuracy").innerText = f"{acc:.0f}"

def show_report():
    # 1. 產生總結資訊
    acc = (correct / total * 100) if total > 0 else 0
    summary = (f"🎯 總計答題：{total} 題<br>"
               f"✅ 答對題數：{correct} 題<br>"
               f"❌ 答錯題數：{total - correct} 題<br>"
               f"📈 最終正確率：{acc:.1f}%")
    document.querySelector("#summary-text").innerHTML = summary

    # 2. 產生詳細清單
    report_list = document.querySelector("#report-list")
    report_list.innerHTML = ""
    for item in reversed(history):
        div = document.createElement("div")
        div.className = "report-item"
        status_class = "correct" if item['is_correct'] else "wrong"
        icon = "✅" if item['is_correct'] else "❌"
        div.innerHTML = f"<span>{item['q']}</span> <span class='{status_class}'>{item['user_ans']} ({icon} {item['correct_ans']})</span>"
        report_list.appendChild(div)
    
    document.querySelector("#report-container").style.display = "block"

async def timer_loop():
    global is_running
    while is_running:
        elapsed = int(time.time() - start_time)
        remaining = DURATION - elapsed
        if remaining <= 0:
            is_running = False
            document.querySelector("#timer").innerText = "時間到！"
            document.querySelector("#question").innerText = "FINISH"
            document.querySelector("#submit-btn").innerText = "重新開始挑戰"
            
            # 儲存歷史紀錄
            current_high = int(window.localStorage.getItem("int_math_high_score") or 0)
            if correct > current_high:
                window.localStorage.setItem("int_math_high_score", str(correct))
            
            show_report()
            break
        document.querySelector("#timer").innerText = f"剩餘時間：{remaining}s"
        await asyncio.sleep(0.5)

def next_question():
    global num1, num2, ans
    mode = random.choice(["+", "-"])
    # 設定正負數範圍 (-99 到 99)
    num1 = random.randint(-99, 99)
    num2 = random.randint(-99, 99)
    
    if mode == "+":
        ans = num1 + num2
    else:
        ans = num1 - num2
    
    # 格式化顯示題目
    q_str = f"{format_num(num1, True)} {mode} {format_num(num2)} = ?"
    document.querySelector("#question").innerText = q_str
    document.querySelector("#answer").value = ""
    document.querySelector("#answer").focus()

async def handle_submit():
    global is_running, start_time, correct, total, history
    
    if not is_running:
        is_running = True
        correct = total = 0
        history = []
        document.querySelector("#report-container").style.display = "none"
        start_time = time.time()
        document.querySelector("#submit-btn").innerText = "提交答案"
        document.querySelector("#feedback").innerText = ""
        update_ui()
        next_question()
        await timer_loop()
        return

    user_val = document.querySelector("#answer").value
    if not user_val: return
    
    total += 1
    current_q = document.querySelector("#question").innerText.replace(" = ?", "")
    user_ans_int = int(user_val)
    is_correct = (user_ans_int == ans)

    history.append({
        "q": current_q,
        "user_ans": user_ans_int,
        "correct_ans": ans,
        "is_correct": is_correct
    })

    if is_correct:
        correct += 1
        document.querySelector("#feedback").style.color = "var(--success)"
        document.querySelector("#feedback").innerText = "✅ 正確！"
    else:
        document.querySelector("#feedback").style.color = "var(--danger)"
        document.querySelector("#feedback").innerText = f"❌ 錯誤！(答案是 {ans})"
    
    update_ui()
    next_question()

def handle_keydown(event):
    if event.key == "Enter":
        asyncio.ensure_future(handle_submit())

document.querySelector("#submit-btn").onclick = create_proxy(lambda e: asyncio.ensure_future(handle_submit()))
document.querySelector("#answer").onkeydown = create_proxy(handle_keydown)
document.querySelector("#question").innerText = "準備好了嗎？"
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>
</html>
