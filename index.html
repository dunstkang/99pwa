<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>整數加減練習器</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4A90E2">

    <!-- PyScript 核心資源 -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #fdfdfd; }
        .card { background: white; padding: 30px; border-radius: 20px; display: inline-block; box-shadow: 0 10px 25px rgba(0,0,0,0.1); min-width: 320px; }
        #question { font-size: 3rem; margin-bottom: 25px; color: #2c3e50; font-weight: bold; }
        input { font-size: 1.8rem; width: 120px; padding: 10px; text-align: center; border: 2px solid #3498db; border-radius: 10px; outline: none; }
        button { font-size: 1.4rem; padding: 10px 25px; margin-left: 10px; cursor: pointer; background: #3498db; color: white; border: none; border-radius: 10px; }
        #feedback { margin-top: 25px; font-size: 1.5rem; font-weight: bold; min-height: 1.6em; }
    </style>
</head>
<body>

    <div class="card">
        <div id="question">環境載入中...</div>
        <input type="text" id="answer" inputmode="numeric" placeholder="答案" autocomplete="off">
        <button id="submit-btn">送出</button>
        <div id="feedback"></div>
    </div>

    <script type="py">
from pyscript import document
import random
import asyncio

num1 = num2 = correct_ans = 0
op = "+"

def next_question():
    global num1, num2, op, correct_ans
    # 隨機選擇數字與運算符號
    num1 = random.randint(-50, 50)
    num2 = random.randint(-50, 50)
    op = random.choice(["+", "-"])
    
    # 計算正確答案
    if op == "+":
        correct_ans = num1 + num2
    else:
        correct_ans = num1 - num2
    
    # 格式化顯示：如果是負數就加上括號
    s1 = f"({num1})" if num1 < 0 else f"{num1}"
    s2 = f"({num2})" if num2 < 0 else f"{num2}"
    
    document.querySelector("#question").innerText = f"{s1} {op} {s2} = ?"
    document.querySelector("#answer").value = ""
    document.querySelector("#feedback").innerText = ""

async def check_answer(event):
    user_input = document.querySelector("#answer").value
    if not user_input: return
    
    try:
        if int(user_input) == correct_ans:
            document.querySelector("#feedback").innerText = "✅ 太棒了！"
            document.querySelector("#feedback").style.color = "#27ae60"
            await asyncio.sleep(0.8)
            next_question()
        else:
            document.querySelector("#feedback").innerText = f"❌ 再試試看 (提示：{correct_ans})"
            document.querySelector("#feedback").style.color = "#e74c3c"
    except ValueError:
        document.querySelector("#feedback").innerText = "⚠️ 請輸入有效數字"

from pyodide.ffi import create_proxy
document.querySelector("#submit-btn").onclick = create_proxy(check_answer)

# 支援 Enter 鍵送出
async def handle_enter(event):
    if event.key == "Enter":
        await check_answer(None)
document.querySelector("#answer").onkeypress = create_proxy(handle_enter)

next_question()
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
